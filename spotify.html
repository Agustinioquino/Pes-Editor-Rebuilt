<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Spotify · PES Editor Rebuilt</title>
<style>
:root{color-scheme:dark light}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:#0b0d10;color:#e8eaed;font:16px/1.5 system-ui,sans-serif;text-align:center;padding:16px;box-sizing:border-box}
b{color:#1ed760}
</style>
</head>
<body>
<p id="m">Conectando con Spotify…</p>
<script>
// Spotify vuelve acá después de iniciar sesión. Le pasa la respuesta al editor (la ventana que abrió esta) y se cierra.
(function () {
  var q = new URLSearchParams(location.search), en = (localStorage.getItem('edit21-lang') || 'es') === 'en';
  var r = { code: q.get('code') || '', state: q.get('state') || '', error: q.get('error') || '' };
  try { localStorage.setItem('edit21-spotify-code', JSON.stringify(r)); } catch (e) { }
  try { if (window.opener) window.opener.postMessage({ spotify: r }, location.origin); } catch (e) { }
  document.getElementById('m').innerHTML = r.error
    ? (en ? 'Spotify was not connected. You can close this window.' : 'No se conectó Spotify. Podés cerrar esta ventana.')
    : (en ? '<b>Spotify connected.</b> Go back to the editor.' : '<b>Spotify conectado.</b> Volvé al editor.');
  setTimeout(function () { window.close(); }, 900);
})();
</script>
</body>
</html>
