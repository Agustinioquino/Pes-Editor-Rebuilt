# Arma la app de escritorio para Windows (carpeta desktop/): instalador y versión portátil.
# Corre cuando cambia algo en desktop/ y se puede lanzar a mano. Los .exe quedan en "Artifacts" de la corrida.
name: App de escritorio

on:
  push:
    branches: [main]
    paths: ['desktop/**', '.github/workflows/app.yml']
  pull_request:
    paths: ['desktop/**', '.github/workflows/app.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npx electron-builder --win nsis portable --x64 --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: PES-Editor-Rebuilt-Windows
          path: |
            desktop/dist/*.exe
          if-no-files-found: error
