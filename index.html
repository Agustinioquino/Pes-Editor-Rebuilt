<html lang="es">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#141c18">
<title>PES Editor Rebuilt</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="64x64" href="icons/favicon-64.png">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Saira+Condensed:wght@500;600;700;800&family=Saira:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="css/editor.css">
<div class="top">
  <div class="top-in">
    <button class="brand" id="bHome" type="button" title="Volver al inicio" aria-label="PES Editor Rebuilt: volver al inicio"><span class="brandfx" aria-hidden="true"><i class="bfill"></i><i class="bline"></i></span><img class="brandlogo" id="brandLogo" alt="PES Editor Rebuilt · Pro Evolution Soccer" width="244" height="84"></button>
    <div class="tophead">
      <div class="toprow">
        <div class="gsearch">
      <input type="search" id="gq" placeholder="Buscar equipo o jugador…  ( / )" autocomplete="off" aria-label="Buscar en todo el archivo" disabled>
      <div class="gres" id="gres" hidden></div>
    </div>
        <div class="brandsub"><b>Editor EDIT 21</b><span>eFootball PES 2021 · v0.054 alpha</span><span class="appdate" id="appDate" data-noi18n hidden></span></div>
      </div>
      <div class="btns">
      <button class="btn ghost icon" id="bUndo" type="button" disabled title="Deshacer (Ctrl+Z)" aria-label="Deshacer">↶</button>
      <button class="btn ghost icon" id="bRedo" type="button" disabled title="Rehacer (Ctrl+Y)" aria-label="Rehacer">↷</button>
      <span class="sep" aria-hidden="true"></span>
      <button class="btn" id="bReload" type="button" disabled title="Volver a leer el EDIT de la carpeta del juego (por ejemplo después de editar en el juego)">🔄 Recargar</button>
      <button class="btn" id="bFindEdit" type="button" title="Buscar el EDIT de nuevo, elegir su carpeta o abrir el archivo a mano">📂 Buscar EDIT</button>
      <button class="btn" id="bNames" type="button" disabled title="Elegí el archivo Player.bin del juego para ver los nombres de los jugadores">Conectar Player.bin</button>
      <button class="btn siderbtn" id="bKits" type="button" title="Elegí la carpeta de Sider de tu juego: lee kits, caras y nombres de jugadores"><img id="siderIco" alt="" width="22" height="22">Conectar carpeta Sider</button>
    </div>
    </div>
    <div class="topsave"><button class="btn primary" id="bSave" type="button" disabled>Guardar</button></div>
    <input type="file" id="fFile" hidden>
    <input type="file" id="fNames" hidden accept=".bin">
  </div>
</div>
<nav class="tabbar" id="tabbar">
  <div class="tabs" role="tablist">
    <button class="tab" role="tab" id="tTeams" aria-selected="true" type="button">Equipos<span class="count" id="cTeams"></span></button>
    <button class="tab" role="tab" id="tNats" aria-selected="false" type="button">Selecciones<span class="count" id="cNats"></span></button>
    <button class="tab" role="tab" id="tPlayers" aria-selected="false" type="button">Jugadores<span class="count" id="cPlayers"></span></button>
    <button class="tab" role="tab" id="tWepes" aria-selected="false" type="button" title="Archivos de la carpeta WEPES del juego">WEPES<span class="count" id="cWepes"></span></button>
    <button class="tab" role="tab" id="tSider" aria-selected="false" type="button" title="Tu carpeta Sider: qué mods y módulos tiene, y edición fácil de sider.ini">Sider<span class="count" id="cSider"></span></button>
    <button class="tab" role="tab" id="tFile" aria-selected="false" type="button">Archivo<span class="count" id="cChanges"></span></button>
    <button class="tab" role="tab" id="tNews" aria-selected="false" type="button" title="Cambios y actualizaciones del editor">Novedades<span class="count" id="cNews"></span></button>
    <div class="status" id="status" style="margin-left:auto;padding:0 4px"></div>
    <button class="btn ghost small uibtn" id="bGfx" type="button" aria-expanded="false" aria-controls="gfxPanel" title="Modo gráfico (moderno, clásico, retro) y calidad (baja, media, alta)"><span aria-hidden="true">🖥️</span><span class="ublab"> Gráficos</span></button>
    <button class="btn ghost small uibtn" id="bUi" type="button" aria-expanded="false" aria-controls="uiPanel" title="Colores, modo claro u oscuro, fuente, esquinas y tamaño de letra"><span aria-hidden="true">🎨</span><span class="ublab"> Apariencia</span></button>
    <span class="minibtns"><button class="btn ghost small" id="mUndo" type="button" title="Deshacer (Ctrl+Z)">↶</button><button class="btn primary small" id="mSave" type="button">Guardar</button></span>
  </div>
</nav>
